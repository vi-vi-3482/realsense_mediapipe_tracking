[project]
name = "realsense-mediapipe-tracking"
version = "0.1.3"
description = "Combines Intel RealSense and Mediapipe for hand tracking."
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "mediapipe==0.10.14",
    "open3d>=0.19.0",
    "opencv-python>=4.12.0.88",
    "pyrealsense2>=2.56.5.9235",
]


authors = [
  { name = "Haider Allawi", email = "haider_al@me.com" }
]

license = { file = "LICENSE.md" }

keywords = ["realsense", "mediapipe", "hand-tracking", "computer-vision"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)", 
  "Topic :: Scientific/Engineering :: Image Processing"
]


[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/vi-vi-3482/realsense-mediapipe-tracking"
Repository = "https://github.com/vi-vi-3482/realsense-mediapipe-tracking"
Issues = "https://github.com/vi-vi-3482/realsense-mediapipe-tracking/issues"